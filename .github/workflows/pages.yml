name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'production' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Write public release marker
        env:
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          node --input-type=module -e '
            import { writeFileSync } from "node:fs";
            writeFileSync("dist/release.json", JSON.stringify({
              commit: process.env.RELEASE_COMMIT,
              builtAt: new Date().toISOString()
            }) + "\n");
          '
      - name: Upload tested site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Publish tested site
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  verify:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify live revision and editor entry
        env:
          SITE_URL: ${{ needs.deploy.outputs.page_url }}
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 24); do
            if curl --fail --silent --show-error "${SITE_URL%/}/release.json?commit=${EXPECTED_COMMIT}&attempt=${attempt}" |
              jq -e --arg sha "$EXPECTED_COMMIT" '.commit == $sha' >/dev/null; then
              curl --fail --silent --show-error \
                --output "$RUNNER_TEMP/planet-index.html" \
                "${SITE_URL%/}/?commit=${EXPECTED_COMMIT}"
              grep -q 'id="studio-canvas"' "$RUNNER_TEMP/planet-index.html"
              echo "Verified published commit ${EXPECTED_COMMIT}"
              exit 0
            fi
            sleep 10
          done
          echo "The requested commit was not verified on the live site" >&2
          exit 1
